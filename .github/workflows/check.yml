name: check
# Fails if any entry is dead, renamed or archived. Runs on every pull request and once a month.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 1 * *"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node --test build.test.mjs
      - run: node build.mjs --check
        env:
          GITHUB_TOKEN: ${{ github.token }}
